# Strategy: "Search first, pin exact versions, re-verify monthly".
# Dependabot automates update discovery while preserving human oversight on changelogs.

version: 2
updates:
  # ---------------------------------------------------------------------------
  # 1. Gateway Core Dependencies (pip)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "gateway"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    rebase-strategy: "auto"
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------------------------
  # 2. Mock Providers Service (pip)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "pip"
    directory: "/deploy/mock-providers"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "mock-providers"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    rebase-strategy: "auto"
    groups:
      mock-providers-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------------------------
  # 3. Root Docker Base Images
  # ---------------------------------------------------------------------------
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
    rebase-strategy: "auto"

  # ---------------------------------------------------------------------------
  # 4. Mock Providers Docker Base Images
  # ---------------------------------------------------------------------------
  - package-ecosystem: "docker"
    directory: "/deploy/mock-providers"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
    rebase-strategy: "auto"

  # ---------------------------------------------------------------------------
  # 5. GitHub Actions Workflows
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(deps)"
    rebase-strategy: "auto"
    groups:
      actions:
        patterns:
          - "*"
