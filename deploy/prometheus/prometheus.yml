# Prometheus scrape config for the gateway's own GET /metrics (TRD:
# "exposed on GET /metrics for scraping every 5-15 seconds"). Inert until
# Phase 5 mounts it into an actual Prometheus container -- see
# deploy/prometheus/alerts.yml's header for why docker-compose.yml stays
# Redis-only through Phase 4 (explicit developer sign-off at Phase 4
# kickoff).
#
# `gateway:8000` assumes the Phase 5 compose network names the gateway
# service `gateway` -- re-verify against whatever service name that
# compose file actually uses once it exists; not guessable correctly from
# Phase 4 alone.

global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "llm-gateway"
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8000"]
