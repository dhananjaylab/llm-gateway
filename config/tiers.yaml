# Abstract model-tier -> fallback-chain mapping (Phase 3).
#
# A client requests a TIER, not a specific vendor model (e.g.
# "model": "tier-1-reasoning" instead of "model": "openai:gpt-5.4"), and
# the gateway walks `chain` in order, per app/resilience/fallback.py:
# retry the current link with backoff, and on exhaustion/an open circuit
# advance to the next link, transparently to the caller (Document 03,
# Journey B).
#
# A team must still have the tier name itself in its `allowed_models`
# (config/teams.yaml / the Admin API) to request it — tiers don't bypass
# the existing per-team model allow-list, they're just another kind of
# entry in it. Literal "provider:model" ids (Phase 1/2 style) keep working
# unchanged: anything not found as a key below is treated as its own
# one-link "chain", so a literal request never gets surprise fallback
# behavior it didn't ask for.
#
# VERSION NOTE (Phase 4 kickoff, developer sign-off): chains below were
# upgraded from gpt-5.4 to the GPT-5.6 "Sol/Terra/Luna" family (GA July 9
# 2026, repriced July 30 2026) per explicit developer sign-off ahead of
# Phase 4 — this was flagged as an open decision at Phase 3 handoff and
# resolved here rather than silently carried forward. Sol replaces gpt-5.4
# as the tier-1-reasoning primary; Terra is newly added as the tier-2-fast
# primary (tier-2 previously had no OpenAI link at all). See
# config/pricing.yaml for the matching cost rows and
# app/providers/openai_adapter.py for an adapter-level fix this upgrade
# surfaced (temperature/top_p are no longer sent to any OpenAI model,
# not just `stop` — GPT-5.6 rejects both, same constraint Anthropic's
# adapter already applies to Sonnet 5/Opus 4.7+).
#
# Model-id note: "gpt-5.6-sol" / "gpt-5.6-terra" are the tier-qualified
# ids (as opposed to the bare "gpt-5.6" alias, which silently defaults to
# Sol) — re-verify these exact strings against
# platform.openai.com/docs/api-reference/chat before this ever bills a
# real account, same as every other model id in this file.
#
# Gemini is included as a late-chain fallback using the stable
# `gemini-3.6-flash` model id. GeminiAdapter.stream() still raises a
# non-retryable ProviderError (streaming isn't implemented here; see
# app/providers/gemini_adapter.py), so Gemini is placed after the local
# Ollama fallback to minimize the chance a streaming request ever reaches
# it. Non-streaming requests and health probes can use it normally.

tiers:
  tier-1-reasoning:
    chain: ["openai:gpt-5.6-sol", "anthropic:claude-sonnet-5", "ollama:llama3.2", "gemini:gemini-3.6-flash"]

  tier-2-fast:
    chain: ["openai:gpt-5.6-terra", "anthropic:claude-haiku-4-5", "ollama:llama3.2", "gemini:gemini-3.6-flash"]

  tier-3-local:
    chain: ["ollama:llama3.2"]
