# Per-team gateway configuration.
#
# api_key_hash is sha256("<raw key>"), never the raw key — see
# scripts/hash_api_key.py to generate one for a new team. The raw demo
# keys below exist only so this file is runnable out of the box; rotate
# them before this ever points at a real provider account.
#
#   data-science   -> sk-gw-datascience-demo-001
#   product-eng    -> sk-gw-producteng-demo-002
#   batch-devs     -> sk-gw-batchdevs-demo-003
#
# rpm_cap / tpm_cap / budget_cap_usd are read into TeamConfig now so
# Phase 2's rate limiter and budget enforcement have a real source of
# truth to wire up to; the Phase 1 stub (app/ratelimit/stub.py) does not
# enforce them yet.
#
# `model` on a request must be a provider-qualified id — "<provider>:<model>"
# — matching one of a team's allowed_models. VERSION NOTE: the example
# model ids below (gpt-5.4, claude-sonnet-5, claude-haiku-4-5-20251001,
# llama3.2) were current at time of writing; provider model catalogs shift
# monthly; re-verify before pointing this at production traffic. The
# abstract "tier-1-reasoning"-style tier names from the TRD arrive in
# Phase 3 — Phase 1 requests must name a concrete provider:model pair.

teams:
  data-science:
    api_key_hash: "sha256:3495bea900033105c5e95c609a05b959649f8908419f8bd61183a26e12263533"
    allowed_models:
      - "openai:gpt-5.4"
      - "anthropic:claude-sonnet-5"
      - "ollama:llama3.2"
    rpm_cap: 100
    tpm_cap: 50000
    budget_cap_usd: 500.00
    budget_period: "monthly"
    priority_tier: "realtime"
    policy:
      system_prompt_prefix: "You are an enterprise assistant for the Data Science team. Answer concisely."
      pii_redaction: true

  product-eng:
    api_key_hash: "sha256:41d189c39c59f3f2bdd6b44091927276f04e8f5abd2b3dcae09609515796e23a"
    allowed_models:
      - "anthropic:claude-haiku-4-5-20251001"
      - "ollama:llama3.2"
    rpm_cap: 60
    tpm_cap: 20000
    budget_cap_usd: 200.00
    budget_period: "monthly"
    priority_tier: "realtime"
    policy:
      system_prompt_prefix: null
      pii_redaction: false

  batch-devs:
    api_key_hash: "sha256:de6d337161988d647440eb8190bbe17904e2ea6849c2daf98172d2c6b80b6c36"
    allowed_models:
      - "ollama:llama3.2"
    rpm_cap: 20
    tpm_cap: 10000
    budget_cap_usd: 50.00
    budget_period: "monthly"
    priority_tier: "batch"
    policy:
      system_prompt_prefix: null
      pii_redaction: false
