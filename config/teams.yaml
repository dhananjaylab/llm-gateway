# Per-team gateway configuration — Phase 2 SEED data.
#
# IMPORTANT (Phase 2 change): this file is now only the *bootstrap seed*.
# On first boot, if Redis has no team_config:* keys yet, the gateway loads
# this file once and writes it into Redis (see app/core/team_store.py,
# TeamConfigStore.seed_from_yaml_if_empty). After that, Redis is the
# runtime source of truth and the Admin API (PATCH /admin/limits/{team},
# PATCH /admin/budgets/{team}) is what mutates live config — editing this
# file after first boot has no effect until Redis is flushed. See the
# Phase 2 README "Design decisions" section for the full rationale.
#
# api_key_hash is sha256("<raw key>"), never the raw key — see
# scripts/hash_api_key.py to generate one for a new team.
#
#   data-science   -> sk-gw-datascience-demo-001
#   product-eng    -> sk-gw-producteng-demo-002
#   batch-devs     -> sk-gw-batchdevs-demo-003
#
# rpm_cap / tpm_cap / budget_cap_usd are now REAL, atomically enforced
# limits as of Phase 2 (app/ratelimit/limiter.py, app/ratelimit/budget.py)
# — Phase 1's stub ignored them.

teams:
  data-science:
    api_key_hash: "sha256:3495bea900033105c5e95c609a05b959649f8908419f8bd61183a26e12263533"
    allowed_models:
      - "gemini:gemini-3.6-flash"
